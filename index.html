/* Layout: every screen is drawn on a 1440×900 design frame (900×1440 in portrait) scaled to fit;
   1u = one design pixel. Backgrounds and the ticker bleed to the screen edges. */
:root{
  color-scheme:light;
  --paper:#f2f2f2; --ink:#1c1c1c; --night:#181818;
  --bg:var(--paper); --fg:var(--ink); --smear:rgba(28,28,28,.22); --sub:rgba(28,28,28,.5);
  --vh:1vh;
  --fw:1440; --fh:900;
  --u:min(calc(100vw / 1440), calc(var(--vh) * 100 / 900));
  --f-kr:'GS Flex SRF','Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',system-ui,sans-serif;
  --f-num:'GS Flex SRF','Pretendard Variable',system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-io:cubic-bezier(.65,0,.35,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --safe-t:env(safe-area-inset-top,0px);
}
@supports (height:1dvh){ :root{ --vh:1dvh } }
@media (orientation:portrait){ :root{ --fw:900; --fh:1440; --u:min(calc(100vw / 900), calc(var(--vh) * 100 / 1440)) } }
body.grand{ color-scheme:dark; --bg:#0a0a0a; --fg:var(--paper); --smear:rgba(242,242,242,.22); --sub:rgba(242,242,242,.5) }

*{box-sizing:border-box}
html,body{margin:0;height:100%;font-synthesis-weight:none;font-synthesis:none;overflow:hidden;background:var(--paper);overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-font-smoothing:antialiased}
body{position:fixed;inset:0;background:var(--bg);color:var(--fg);font-family:var(--f-kr);transition:background-color .9s var(--ease),color .9s var(--ease)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation}
button:focus{outline:none}
button:focus-visible{outline:2px solid currentColor;outline-offset:4px}
[hidden]{display:none!important}
#app{position:fixed;inset:0;overflow:hidden}

/* brand marks: transparent artwork used as masks so they take the current text color */
.logo{display:block;aspect-ratio:1347/452;background:currentColor;-webkit-mask:url(logo-mono.png) center/contain no-repeat;mask:url(logo-mono.png) center/contain no-repeat}
.srf{display:block;aspect-ratio:500/205;background:currentColor;-webkit-mask:url(srf-logo.png) center/contain no-repeat;mask:url(srf-logo.png) center/contain no-repeat}
.cross{position:relative;display:block}
.cross::before,.cross::after{content:"";position:absolute;left:50%;top:50%;width:141%;height:var(--line,2px);margin:calc(var(--line,2px) / -2) 0 0 -70.5%;background:currentColor;transform:rotate(45deg)}
.cross::after{transform:rotate(-45deg)}

/* ---------- design frame ---------- */
.frame{position:absolute;left:50%;top:50%;width:calc(var(--fw) * var(--u));height:calc(var(--fh) * var(--u));transform:translate(-50%,-50%)}
.at{position:absolute;left:calc(var(--x) * var(--u));top:calc(var(--y) * var(--u));translate:-50% -50%}
.at.left{translate:0 -50%}

/* positions: landscape */
.p-srf{--x:383;--y:301}      .p-x{--x:383;--y:441}       .p-logo{--x:383;--y:588}
.p-sprompt{--x:1044;--y:243} .p-up{--x:1044;--y:311}     .p-pick{--x:1044;--y:478}
.p-down{--x:1044;--y:658}    .p-hint{--x:1044;--y:724}   .p-ok{--x:1318;--y:783}
.p-resume{--x:383;--y:780}
.p-tag{--x:720;--y:177}      .p-prompt{--x:720;--y:237}  .p-digits{--x:720;--y:450}
.p-pill{--x:720;--y:752}     .p-busy{--x:720;--y:678}    .p-link{--x:97;--y:752}
.p-fglabel{--x:720;--y:318}  .p-fgnum{--x:720;--y:452}   .p-fslabel{--x:720;--y:612}
.p-fchips{--x:720;--y:686}   .p-fabsent{--x:720;--y:764} .p-freset{--x:720;--y:830}
/* positions: portrait */
@media (orientation:portrait){
  .p-srf{--x:450;--y:250}    .p-x{--x:450;--y:390}       .p-logo{--x:450;--y:537}
  .p-resume{--x:450;--y:668} .p-sprompt{--x:450;--y:780} .p-up{--x:450;--y:850}
  .p-pick{--x:450;--y:1012}  .p-down{--x:450;--y:1176}   .p-hint{--x:450;--y:1236}
  .p-ok{--x:450;--y:1326}
  .p-tag{--x:450;--y:360}    .p-prompt{--x:450;--y:420}  .p-digits{--x:450;--y:660}
  .p-pill{--x:450;--y:960}   .p-busy{--x:450;--y:900}    .p-link{--x:450;--y:1100}
  .p-fglabel{--x:450;--y:520}.p-fgnum{--x:450;--y:680}   .p-fslabel{--x:450;--y:862}
  .p-fchips{--x:450;--y:978} .p-fabsent{--x:450;--y:1120}.p-freset{--x:450;--y:1230}
  .at.left{translate:-50% -50%}
}

/* ---------- type & controls ---------- */
.tag{font:700 calc(var(--u) * 23)/1.2 var(--f-kr);letter-spacing:-.01em;white-space:nowrap}
.prompt{font:700 calc(var(--u) * 45)/1.2 var(--f-kr);letter-spacing:-.03em;white-space:nowrap}
.s-prompt{font:700 calc(var(--u) * 28)/1.2 var(--f-kr);letter-spacing:-.02em;white-space:nowrap}
.busy{font:700 calc(var(--u) * 48)/1.2 var(--f-kr);letter-spacing:-.03em;white-space:nowrap}
.pill{display:grid;place-items:center;width:calc(var(--u) * 326);height:calc(var(--u) * 110);border-radius:999px;background:var(--fg);color:var(--bg);font:700 calc(var(--u) * 30)/1 var(--f-kr);letter-spacing:-.02em;transition:transform .55s var(--spring),opacity .45s var(--ease),background-color .9s var(--ease),color .9s var(--ease)}
.pill:active{transform:scale(.95);transition-duration:.15s}
.link{font:700 calc(var(--u) * 28)/1.2 var(--f-kr);letter-spacing:-.02em;text-decoration:underline;text-decoration-thickness:.08em;text-underline-offset:.24em;white-space:nowrap;transition:opacity .3s var(--ease)}
.link:active{opacity:.5}
.link.small{font-size:calc(var(--u) * 22)}

/* ---------- ticker ---------- */
.ticker{position:fixed;left:0;right:0;top:0;z-index:30;will-change:transform;display:flex;align-items:center;overflow:hidden;height:calc(var(--u) * 48 + var(--safe-t));padding-top:var(--safe-t);background:var(--fg);color:var(--bg);transition:background-color .9s var(--ease),color .9s var(--ease),transform .9s var(--ease)}

/* sound on/off: sits on the ticker's right end, and stays reachable over the dark screens */
.snd{position:fixed;top:0;right:0;z-index:62;display:grid;place-items:center;width:calc(var(--u) * 76);height:calc(var(--u) * 48 + var(--safe-t));padding-top:var(--safe-t);background:var(--fg);color:var(--bg);transition:background-color .9s var(--ease),color .9s var(--ease),opacity .6s var(--ease)}
.snd::before{content:"";position:absolute;right:100%;top:0;bottom:0;width:calc(var(--u) * 64);background:linear-gradient(to right,transparent,var(--fg));pointer-events:none;transition:opacity .4s var(--ease)}
.snd svg{width:calc(var(--u) * 26);height:calc(var(--u) * 26);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .4s var(--spring)}
.snd:active svg{transform:scale(.85)}
.snd.muted .on,.snd:not(.muted) .off{display:none}
body.grand .ticker{transform:translateY(-100%)}
body.grand .tk-track{animation-play-state:paused}
body:has(#win.open) .snd,body:has(#gate.show) .snd,body:has(#intro.open) .snd,body.grand .snd{background:transparent;color:var(--paper)}
body:has(#win.open) .snd::before,body:has(#gate.show) .snd::before,body:has(#intro.open) .snd::before,body.grand .snd::before{opacity:0}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;z-index:10;opacity:0;visibility:hidden;transition:opacity .7s var(--ease),visibility 0s .7s}
.screen.active{opacity:1;visibility:visible;transition:opacity .7s var(--ease),visibility 0s}
.screen.active .rv{animation:rv 1s var(--ease) backwards;animation-delay:calc(var(--i, 0) * 80ms + 120ms)}
@keyframes rv{from{opacity:0;transform:translateY(calc(var(--u) * 26));filter:blur(8px)}}

/* setup */
.s-srf{width:calc(var(--u) * 346)}
.s-x{width:calc(var(--u) * 53);height:calc(var(--u) * 53);--line:calc(var(--u) * 2.4)}
.s-logo{width:calc(var(--u) * 394)}
.chev{display:grid;place-items:center;width:calc(var(--u) * 120);height:calc(var(--u) * 80);border-radius:999px;transition:transform .4s var(--spring),background-color .2s}
.chev:active{transform:scale(.88);background:rgba(28,28,28,.06)}
.chev svg{width:calc(var(--u) * 58);height:calc(var(--u) * 32);fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:square}
.pick{position:relative;width:calc(var(--u) * 780);height:calc(var(--u) * 300);overflow:hidden;cursor:ns-resize;touch-action:none;-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
.pick span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 calc(var(--u) * 230)/1 var(--f-num);will-change:transform}
/* this face sits a little high in its line box; nudge the digits to the optical centre */
.pick span,.dg{padding-top:.12em}
#pickB{transform:translate3d(0,100%,0)}
.pick.nudge{animation:nudge .5s var(--ease)}
@keyframes nudge{20%{transform:translateX(calc(var(--u) * -16))}45%{transform:translateX(calc(var(--u) * 12))}70%{transform:translateX(calc(var(--u) * -6))}}
.hint{font:600 calc(var(--u) * 20)/1.2 var(--f-kr);white-space:nowrap;opacity:0;transform:translateY(calc(var(--u) * -8));transition:opacity .4s var(--ease),transform .5s var(--ease)}
.hint.show{opacity:1;transform:none}
.ok{display:grid;place-items:center;width:calc(var(--u) * 132);height:calc(var(--u) * 132);border-radius:50%;background:var(--fg);color:var(--bg);font:700 calc(var(--u) * 30)/1 var(--f-kr);letter-spacing:-.02em;transition:transform .55s var(--spring)}
.ok:active{transform:scale(.92);transition-duration:.15s}
#numInput{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;font-size:16px;border:0;padding:0}

/* stage */
.digits{--df:240;display:flex;gap:calc(var(--u) * 36);transition:opacity .9s var(--ease)}
@media (orientation:portrait){ .digits{--df:200;gap:calc(var(--u) * 24)} }
.digits.resting{opacity:.2}
.col{position:relative;width:calc(var(--u) * var(--df) * .68);height:calc(var(--u) * 300);overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent);mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent)}
.dg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 calc(var(--u) * var(--df))/1 var(--f-num);will-change:transform}
/* vertical motion blur while a reel spins */
.col.b1 .dg{filter:url(#vb1);text-shadow:0 -.03em 0 var(--smear),0 .03em 0 var(--smear)}
.col.b2 .dg{filter:url(#vb2);text-shadow:0 -.06em 0 var(--smear),0 .06em 0 var(--smear)}
.col.b3 .dg{filter:url(#vb3);text-shadow:0 -.1em 0 var(--smear),0 .1em 0 var(--smear),0 -.05em 0 var(--smear),0 .05em 0 var(--smear)}
.col.settle{animation:settle .5s var(--ease)}
@keyframes settle{from{transform:translateY(calc(var(--u) * 10))}}
.col.beat{animation:beat .6s var(--ease)}
@keyframes beat{from{transform:scale(1.06)}}
.p-busy{opacity:0;transform:translateY(calc(var(--u) * 16));transition:opacity .5s var(--ease),transform .7s var(--ease)}
#stage.m-drawing .p-busy{opacity:1;transform:none;transition-delay:.12s}
#stage:not(.m-start) .p-pill{opacity:0;transform:scale(.9);pointer-events:none}
#stage.has-chips .p-pill{--y:666}
@media (orientation:portrait){ #stage.has-chips .p-pill{--y:960} }
.busy span{display:inline-block;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
.chips{position:absolute;left:0;right:0;bottom:calc(var(--u) * 29);display:flex;justify-content:center;gap:calc(var(--u) * 12);--cd:112}
@media (orientation:portrait){ .chips{bottom:calc(var(--u) * 56);gap:calc(var(--u) * 8);--cd:70} }
.chip{display:grid;place-items:center;width:calc(var(--u) * var(--cd, 84));height:calc(var(--u) * var(--cd, 84));border-radius:50%;background:var(--fg);color:var(--bg);font:400 calc(var(--u) * var(--cd, 84) * .36)/1 var(--f-num);opacity:0;transform:scale(.5);transition:transform .6s var(--spring),opacity .35s var(--ease),background-color .9s var(--ease),color .9s var(--ease)}
.chip.n4{font-size:calc(var(--u) * var(--cd, 84) * .27)}
.chip.on{opacity:1;transform:none}
.chip.arrive{transition:none}
.chip.arrive b{animation:numin .6s var(--ease) backwards .05s}
.chip b{font-weight:inherit}
@keyframes numin{from{opacity:0;transform:scale(.6)}}

/* backgrounds for the dark screens: soft light gradient + grain */
.darkbg{position:absolute;inset:0;overflow:hidden;background:#191919}
.darkbg .lw{position:absolute;inset:0}
.darkbg .light{position:absolute;inset:-25%;background:
  radial-gradient(34% 40% at 60% 46%,rgba(255,255,255,.17),rgba(255,255,255,.05) 55%,transparent 78%),
  radial-gradient(28% 24% at 80% 86%,rgba(255,255,255,.07),transparent 70%),
  radial-gradient(40% 42% at 14% 94%,rgba(0,0,0,.55),transparent 70%);
  animation:drift 18s ease-in-out infinite alternate}
.darkbg .grain{position:absolute;inset:0;background-image:var(--noise);background-size:calc(var(--u) * 180)}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-6%,4%) scale(1.1)}}
.stagebg{z-index:1;opacity:0;transition:opacity 1s var(--ease)}
.darkbg.stagebg{background:#0a0a0a}
.stagebg .light{opacity:.22}
body.grand .stagebg{opacity:1}

/* finale */
.f-glabel,.f-slabel{font:700 calc(var(--u) * 23)/1.2 var(--f-kr);letter-spacing:-.01em;white-space:nowrap}
.f-gcircle{display:grid;place-items:center;width:calc(var(--u) * 210);height:calc(var(--u) * 210);border-radius:50%;background:var(--fg);color:var(--bg);font:400 calc(var(--u) * 76)/1 var(--f-num)}
.f-gcircle.n4{font-size:calc(var(--u) * 58)}
.f-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--u) * 12);width:calc(var(--u) * 1080)}
.f-chips .chip{opacity:1;transform:none}
@media (orientation:portrait){ .f-chips{width:calc(var(--u) * (84 * 5 + 12 * 4))} }
.f-absent{font:500 calc(var(--u) * 17)/1.3 var(--f-kr);color:var(--sub);white-space:nowrap}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:50;visibility:hidden;color:var(--paper)}
.overlay.open{visibility:visible}
#win .lw{opacity:0;transform:scale(.25)}
#win.show .lw{opacity:1;transform:none;transition:opacity 1.4s var(--ease),transform 2s var(--ease)}
#win.is-grand .light{background:
  radial-gradient(34% 42% at 55% 46%,rgba(255,255,255,.26),rgba(255,255,255,.08) 55%,transparent 80%),
  radial-gradient(30% 26% at 82% 86%,rgba(255,255,255,.1),transparent 70%),
  radial-gradient(40% 42% at 14% 94%,rgba(0,0,0,.5),transparent 70%)}
#win .pill{background:var(--paper);color:var(--ink)}
#win .p-pill,#win .p-link{opacity:0;transform:translateY(calc(var(--u) * 22))}
#win.show .p-pill,#win.show .p-link{opacity:1;transform:none;transition:opacity .7s var(--ease) .9s,transform .9s var(--ease) .9s}
#win.show.is-grand .p-pill,#win.show.is-grand .p-link{transition-delay:2.4s,2.4s}
#win.show .p-pill:active{transform:scale(.95);transition:transform .15s}
#win .p-tag,#win .p-prompt{transition:opacity .25s var(--ease)}
#win.closing .p-tag,#win.closing .p-prompt,#win.closing .p-pill,#win.closing .p-link{opacity:0;transition:opacity .25s var(--ease)}
#win .p-digits{transition:transform .75s var(--ease-io),opacity .6s var(--ease)}
.link.armed{text-decoration-style:solid;opacity:1}

#intro{z-index:60}
#intro .il{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u) * 22);text-align:center;opacity:0;transform:translateY(calc(var(--u) * 24));filter:blur(10px);transition:opacity .7s var(--ease),transform .9s var(--ease),filter .7s var(--ease)}
#intro .il.on{opacity:1;transform:none;filter:none}
.i-final{font:400 calc(var(--u) * 150)/1 var(--f-num);white-space:nowrap}
@media (orientation:portrait){ .i-final{font-size:calc(var(--u) * 110)} }
.i-big{font:700 calc(var(--u) * 64)/1.15 var(--f-kr);letter-spacing:-.035em;white-space:nowrap}
#intro .darkbg{background:#0c0c0c}
#intro .lw{opacity:0;transform:scale(.3);transition:opacity 1.6s var(--ease),transform 2.2s var(--ease)}
#intro.lit .lw{opacity:.6;transform:none}

.hushveil{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;transition:opacity .8s var(--ease);background:radial-gradient(ellipse 34% 30% at 50% 50%,transparent 30%,rgba(0,0,0,.9) 100%)}

.gate{position:fixed;inset:0;z-index:45;display:grid;place-items:center;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:opacity .7s var(--ease),visibility 0s .7s}
.gate.show{opacity:1;visibility:visible;transition:opacity .7s var(--ease),visibility 0s}
.gate-btn{position:relative;display:grid;place-items:center;width:calc(var(--u) * 300);height:calc(var(--u) * 300);border-radius:50%;background:var(--paper);color:var(--ink);font:700 calc(var(--u) * 40)/1.2 var(--f-kr);letter-spacing:-.03em;opacity:0;transform:scale(.8);transition:transform .8s var(--spring),opacity .5s var(--ease)}
.gate.show .gate-btn{opacity:1;transform:none;transition-delay:.15s}
.gate.show .gate-btn:active{transform:scale(.95);transition:transform .15s}
.gate-btn::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(242,242,242,.55);animation:halo 2.4s var(--ease) infinite}
@keyframes halo{from{transform:scale(1);opacity:.9}to{transform:scale(1.45);opacity:0}}
#fx{position:fixed;inset:0;z-index:70;width:100%;height:100%;pointer-events:none}
.burst{position:fixed;z-index:68;width:120vmax;height:120vmax;margin:-60vmax 0 0 -60vmax;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,255,255,.5) 18%,rgba(255,255,255,.12) 40%,transparent 66%)}

/* settings sheet & confirm */
.sheet{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.32);opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility 0s .35s}
.sheet.show{opacity:1;visibility:visible;transition:opacity .35s var(--ease),visibility 0s}
.card{width:min(420px,100%);padding:26px 22px 18px;border-radius:28px;background:var(--paper);color:var(--ink);transform:translateY(24px) scale(.97);transition:transform .55s var(--spring)}

.row b{font:600 15px/1 var(--f-kr);color:rgba(28,28,28,.55)}

.card-actions button:active{transform:scale(.96)}
.card-actions .primary{background:var(--ink);color:var(--paper)}

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="vb1" x="-5%" y="-40%" width="110%" height="180%"><feGaussianBlur stdDeviation="0 3"/></filter>
  <filter id="vb2" x="-5%" y="-40%" width="110%" height="180%"><feGaussianBlur stdDeviation="0 8"/></filter>
  <filter id="vb3" x="-5%" y="-40%" width="110%" height="180%"><feGaussianBlur stdDeviation="0 15"/></filter>
</svg>

<div id="app">
  <div class="darkbg stagebg" aria-hidden="true"><div class="lw"><div class="light"></div></div><div class="grain"></div></div>

  <!-- STEP 1 · 참여 인원 -->
  <section id="setup" class="screen active">
    <div class="frame">
      <span class="at p-srf srf s-srf rv" style="--i:0" role="img" aria-label="Seoul Record Fair"></span>
      <span class="at p-x cross s-x rv" style="--i:1" aria-hidden="true"></span>
      <span class="at p-logo logo s-logo rv" style="--i:2" role="img" aria-label="심의필 SEEMEFEEL"></span>
      <button class="at p-resume link small rv" style="--i:3" id="resumeBtn" hidden>이전 추첨 이어하기</button>

      <div class="at p-sprompt s-prompt rv" style="--i:1">위아래로 스크롤하여 참여 인원을 입력해 주세요.</div>
      <button class="at p-up chev rv" style="--i:2" id="upBtn" aria-label="1명 늘리기"><svg viewBox="0 0 58 32"><path d="M2 30 29 3l27 27"/></svg></button>
      <div class="at p-pick pick rv" style="--i:3" id="pick" role="spinbutton" aria-label="참여 인원" aria-valuemin="0" aria-valuemax="9999" aria-valuenow="0"><span id="pickA">0</span><span id="pickB">1</span></div>
      <button class="at p-down chev rv" style="--i:4" id="downBtn" aria-label="1명 줄이기"><svg viewBox="0 0 58 32"><path d="M2 2l27 27L56 2"/></svg></button>
      <div class="at p-hint hint" id="hint"></div>
      <button class="at p-ok ok rv" style="--i:5" id="okBtn">확인</button>
      <input id="numInput" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="참여 인원 직접 입력">
    </div>
  </section>

  <!-- STEP 2·3 · 추첨 -->
  <section id="stage" class="screen">
    <div class="frame">
      <div class="at p-tag tag rv" style="--i:0" id="sTag"></div>
      <div class="at p-prompt prompt rv" style="--i:1" id="sPrompt"></div>
      <div class="at p-digits digits rv" style="--i:2" id="reels"></div>
      <button class="at p-pill pill rv" style="--i:3" id="drawBtn">추첨하기</button>

      <div class="chips" id="chips"></div>
    </div>
  </section>

  <!-- 결과 -->
  <section id="finale" class="screen">
    <div class="frame">
      <div class="at p-tag tag rv" style="--i:0">제15회 서울레코드페어 × 심의필</div>
      <div class="at p-prompt prompt rv" style="--i:1">럭키드로우 당첨자</div>
      <div class="at p-fglabel f-glabel rv" style="--i:2">1등 · handytraxx 턴테이블</div>
      <div class="at p-fgnum f-gcircle rv" style="--i:3" id="fGrandWrap"><b id="fGrand">-</b></div>
      <div class="at p-fslabel f-slabel rv" style="--i:4" id="fShirtLabel">기념티셔츠</div>
      <div class="at p-fchips f-chips rv" style="--i:5" id="fChips"></div>
      <div class="at p-fabsent f-absent rv" style="--i:6" id="fAbsent"></div>
      <button class="at p-freset link small rv" style="--i:7" id="fReset">처음부터 다시</button>
    </div>
  </section>

  <div class="ticker" id="ticker" aria-hidden="true"><div class="tk-track" id="tkTrack"></div></div>
</div>

<!-- STEP 4 · 당첨 -->
<div id="win" class="overlay">
  <div class="darkbg"><div class="lw"><div class="light"></div></div><div class="grain"></div></div>
  <div class="frame">
    <div class="at p-tag tag" id="wTag"></div>
    <div class="at p-prompt prompt" id="wPrompt"></div>
    <div class="at p-digits digits" id="wDigits"></div>
    <button class="at left p-link link" id="redrawBtn">재추첨하기</button>
    <button class="at p-pill pill" id="nextBtn">계속 추첨</button>
  </div>
</div>

<!-- 1등 추첨 인트로 -->
<div id="intro" class="overlay">
  <div class="darkbg"><div class="lw"><div class="light"></div></div><div class="grain"></div></div>

<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const body = document.body;
const KEY = 'srf-luckydraw-v1';
const SHIRTS = 10;            // 기념티셔츠 당첨 인원
const EXCLUDE = true;         // 티셔츠 당첨자는 1등 추첨에서 제외
const rnd = (a, b) => a + Math.random() * (b - a);
const mod10 = (n) => ((n % 10) + 10) % 10;

// film grain texture, generated once
(() => {
  const c = document.createElement('canvas'); c.width = c.height = 180;
  const g = c.getContext('2d'), im = g.createImageData(180, 180);
  for (let i = 0; i < im.data.length; i += 4) { const v = (Math.random() * 255) | 0; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 30; }
  g.putImageData(im, 0, 0);
  document.documentElement.style.setProperty('--noise', 'url(' + c.toDataURL() + ')');
})();

// ticker: three units per half so the loop never shows a gap
$('#tkTrack').innerHTML = ('<span class="tk-unit"><span class="tk-clover">🍀</span>럭키드로우<span class="tk-clover r">🍀</span><span class="logo tk-logo"></span><span class="cross tk-x"></span>서울레코드페어</span>').repeat(6);

/* =========================================================
   Sound: everything is synthesized with Web Audio
   ========================================================= */
const Snd = (() => {
  let ctx = null, out, bgm, bgmF, sfx, rev, noise;
  const prefs = (() => { try { return JSON.parse(localStorage.getItem(KEY + '-snd')) || {}; } catch (e) { return {}; } })();
  let bgmOn = prefs.bgm !== false, sfxOn = prefs.sfx !== false;
  const BGM_VOL = 0.42;
  const mf = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const now = () => ctx.currentTime;
  const savePrefs = () => { try { localStorage.setItem(KEY + '-snd', JSON.stringify({ bgm: bgmOn, sfx: sfxOn })); } catch (e) {} };

  function resume() { const p = ctx.resume(); if (p && p.catch) p.catch(() => {}); }
  function init() {
    if (ctx) { if (ctx.state !== 'running') resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    // iOS 17+: play through the silent switch
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -10; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.25;
    out = ctx.createGain(); out.gain.value = 0.9;
    out.connect(comp); comp.connect(ctx.destination);
    rev = ctx.createConvolver(); rev.buffer = impulse(2.4, 2.8);
    const rv = ctx.createGain(); rv.gain.value = 0.5; rev.connect(rv); rv.connect(out);
    bgm = ctx.createGain(); bgm.gain.value = bgmOn ? BGM_VOL : 0;
    bgmF = ctx.createBiquadFilter(); bgmF.type = 'lowpass'; bgmF.frequency.value = 18000; bgmF.Q.value = 1.4;
    bgm.connect(bgmF); bgmF.connect(out);
    const bs = ctx.createGain(); bs.gain.value = 0.12; bgmF.connect(bs); bs.connect(rev);
    sfx = ctx.createGain(); sfx.gain.value = sfxOn ? 1 : 0; sfx.connect(out);
    const ss = ctx.createGain(); ss.gain.value = 0.22; sfx.connect(ss); ss.connect(rev);
    noise = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    if (ctx.state !== 'running') resume();
  }
  function impulse(sec, decay) {
    const len = (ctx.sampleRate * sec) | 0, b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
    return b;
  }

  // building blocks
  function osc(type, f, t, dur, dest) { const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.connect(dest); o.start(t); o.stop(t + dur + 0.05); return o; }
  function G(t, a, peak, dur, dest) { const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(dur, a + 0.01)); g.connect(dest); return g; }
  function N(t, dur, dest) { const s = ctx.createBufferSource(); s.buffer = noise; s.loop = true; s.connect(dest); s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05); return s; }
  function F(type, f, q, dest) { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; b.connect(dest); return b; }

  // instruments
  function kick(t, v = 1, d = bgm) {
    const o = osc('sine', 160, t, 0.5, G(t, 0.003, v, 0.45, d)); o.frequency.exponentialRampToValueAtTime(44, t + 0.12);
    const o2 = osc('triangle', 240, t, 0.08, G(t, 0.001, v * 0.35, 0.06, d)); o2.frequency.exponentialRampToValueAtTime(90, t + 0.05);
  }
  function snare(t, v = 0.5, d = bgm) {
    N(t, 0.2, F('highpass', 1300, 0.7, G(t, 0.001, v, 0.17, d)));
    const o = osc('triangle', 230, t, 0.12, G(t, 0.001, v * 0.55, 0.1, d)); o.frequency.exponentialRampToValueAtTime(150, t + 0.08);
  }
  function hat(t, v = 0.1, open = false, d = bgm) { N(t, open ? 0.3 : 0.06, F('highpass', 8000, 0.8, G(t, 0.001, v, open ? 0.24 : 0.045, d))); }
  function clap(t, v = 0.4, d = bgm) { for (let i = 0; i < 3; i++) { const tt = t + i * 0.012; N(tt, i === 2 ? 0.25 : 0.03, F('bandpass', 1400, 1.1, G(tt, 0.001, v, i === 2 ? 0.2 : 0.02, d))); } }
  function bass(t, f, dur, v = 0.4, cut = 1300, d = bgm) {
    const lp = F('lowpass', cut, 5, G(t, 0.006, v, dur, d));
    lp.frequency.setValueAtTime(cut, t); lp.frequency.exponentialRampToValueAtTime(220, t + dur);
    osc('sawtooth', f, t, dur, lp);
    osc('sine', f, t, dur, G(t, 0.006, v * 0.6, dur, d));
  }
  function stab(t, fs, dur, v = 0.06, d = bgm) {
    const lp = F('lowpass', 2800, 0.8, G(t, 0.006, v, dur, d));
    fs.forEach((f) => { osc('sawtooth', f, t, dur, lp).detune.value = -7; osc('sawtooth', f, t, dur, lp).detune.value = 7; });
  }
  function pad(t, fs, dur, v = 0.03, d = bgm) {
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + dur * 0.3); g.gain.linearRampToValueAtTime(0.0001, t + dur); g.connect(d);
    const lp = F('lowpass', 1500, 0.5, g);
    fs.forEach((f) => [-10, 0, 10].forEach((c) => { osc('sawtooth', f, t, dur, lp).detune.value = c; }));
  }
  function pluck(t, f, dur, v = 0.05, type = 'square', cut = 3000, d = bgm) {
    const lp = F('lowpass', cut, 2, G(t, 0.002, v, dur, d));
    lp.frequency.setValueAtTime(cut, t); lp.frequency.exponentialRampToValueAtTime(500, t + dur);
    osc(type, f, t, dur, lp);
  }
  function wood(t, f, v = 0.15, d = bgm) { osc('sine', f, t, 0.06, F('bandpass', f, 6, G(t, 0.001, v, 0.05, d))); osc('triangle', f * 1.5, t, 0.03, G(t, 0.001, v * 0.3, 0.025, d)); }
  function tom(t, f, v = 0.4, d = bgm) { const o = osc('sine', f, t, 0.4, G(t, 0.002, v, 0.35, d)); o.frequency.exponentialRampToValueAtTime(f * 0.55, t + 0.3); }

  // ---- BGM sequencer (16th-note grid, 4-bar loops) ----
  const Seq = { bpm: 116, step: 0, next: 0, pat: null, timer: null, intensity: 0, bpmTo: 0, bpmStep: 0, tok: 0 };
  const groove = (bpm, roots, chords) => ({
    bpm,
    play(step, t) {
      const s = step % 16, bar = (step >> 4) % 4, sx = 60 / Seq.bpm / 4, r = roots[bar], ch = chords[bar];
      if (s % 4 === 0) kick(t, 0.95);
      if (s === 4 || s === 12) clap(t, 0.42);
      hat(t, s % 2 ? 0.05 : 0.085);
      if (s % 4 === 2) hat(t, 0.13, true);
      if (s % 2 === 0) bass(t, mf(s % 4 === 0 ? r : r + 12), sx * 1.7, 0.4);
      else if (s === 7 || s === 15) bass(t, mf(r + 12), sx * 0.8, 0.26);
      if (s === 6 || s === 14) stab(t, ch.map(mf), sx * 1.2, 0.055);
      if (s === 0 && bar % 2 === 0) pad(t, ch.map(mf), sx * 30, 0.028);
      if ((step >> 5) % 2 === 1) { const i = [0, 3, 6, 10, 12].indexOf(s); if (i >= 0) pluck(t, mf(ch[i % ch.length] + 12), sx * 1.6, 0.05); }
    }
  });
  const PATS = {
    // A minor disco groove for the T-shirt round
    groove: groove(116, [45, 50, 41, 40], [[57, 60, 64, 67], [62, 65, 69, 72], [65, 69, 72, 76], [64, 68, 71, 74]]),
    // E major victory groove after the grand prize
    victory: groove(124, [40, 49, 45, 47], [[64, 68, 71, 75], [61, 64, 68, 71], [57, 61, 64, 68], [59, 63, 66, 69]]),
    // E minor tension loop for the final round; layers grow with Seq.intensity
    tension: {
      bpm: 126,
      play(step, t) {
        const s = step % 16, bar = (step >> 4) % 4, sx = 60 / Seq.bpm / 4, I = Seq.intensity;
        const r = [40, 36, 45, 47][bar], ch = [[64, 67, 71], [60, 64, 67], [57, 60, 64], [59, 63, 66]][bar];
        if (s % 2 === 0) bass(t, mf(r), sx * 1.5, s % 4 === 0 ? 0.42 : 0.3, 700);
        if (I >= 2 && s % 2 === 1) bass(t, mf(r + 12), sx * 0.8, 0.18, 900);
        const kicks = I >= 3 ? [0, 2, 4, 6, 8, 10, 12, 14] : I >= 2 ? [0, 3, 4, 8, 11, 12] : [0, 3, 8];
        if (kicks.indexOf(s) >= 0) kick(t, s % 4 === 0 ? 0.95 : 0.6);
        if (s % 4 === 0) wood(t, s % 8 === 0 ? 1650 : 1250, 0.16);
        if (I >= 1 || bar >= 2) { const arp = [0, 1, 2, 1]; pluck(t, mf(ch[arp[s % 4]] + 12), sx * 0.9, 0.045 + 0.015 * I, 'sawtooth', 2400); }
        if (s === 0) pad(t, ch.map(mf), sx * 16, 0.028 + 0.01 * I);
        if (I >= 1 && (s === 4 || s === 12)) snare(t, 0.28);
        if (I >= 3) { snare(t, s % 4 === 0 ? 0.12 : 0.07); hat(t, 0.07); }
        if (bar === 3 && s >= 12) tom(t, mf(45 + (s - 12) * 3), 0.38);
      }
    }
  };
  function sched() {
    if (!Seq.pat) return;
    const n = now();
    if (Seq.next < n - 0.2) Seq.next = n + 0.05;
    while (Seq.next < n + 0.12) {
      if (Seq.bpmTo) {
        Seq.bpm += Seq.bpmStep;
        if ((Seq.bpmStep > 0 && Seq.bpm >= Seq.bpmTo) || (Seq.bpmStep < 0 && Seq.bpm <= Seq.bpmTo)) { Seq.bpm = Seq.bpmTo; Seq.bpmTo = 0; }
      }
      Seq.pat.play(Seq.step, Seq.next);
      Seq.next += 60 / Seq.bpm / 4;
      Seq.step++;
    }
  }
  function playBGM(name) {
    if (!ctx) return;
    Seq.tok++;
    Seq.pat = PATS[name]; Seq.bpm = Seq.pat.bpm; Seq.bpmTo = 0; Seq.intensity = 0; Seq.step = 0; Seq.next = now() + 0.06;
    restore();
    if (!Seq.timer) Seq.timer = setInterval(sched, 25);
  }
  function stopBGM() { clearInterval(Seq.timer); Seq.timer = null; Seq.pat = null; }
  function rampBpm(to, sec) { Seq.bpmTo = to; Seq.bpmStep = (to - Seq.bpm) / Math.max(1, sec * Seq.bpm * 4 / 60); }
  function restore() {
    const t = now();
    bgm.gain.cancelScheduledValues(t); bgm.gain.setTargetAtTime(bgmOn ? BGM_VOL : 0, t, 0.05);
    bgmF.frequency.cancelScheduledValues(t); bgmF.frequency.setTargetAtTime(18000, t, 0.05);
  }
  // DJ-style lowpass sweep on the BGM while a draw is running
  function duck(on) { if (!ctx) return; const t = now(); bgmF.frequency.cancelScheduledValues(t); bgmF.frequency.setTargetAtTime(on ? 420 : 18000, t, on ? 0.18 : 0.08); }

  // ---- sound effects ----
  let lastTick = 0;
  function tick(v = 0.12, f = 2300) {
    if (!ctx) return;
    const t = now(); if (t - lastTick < 0.028) return; lastTick = t;
    osc('square', f * (0.94 + Math.random() * 0.12), t, 0.03, F('bandpass', f, 4, G(t, 0.0005, v, 0.022, sfx)));
    N(t, 0.012, F('highpass', 5000, 0.7, G(t, 0.0005, v * 0.5, 0.01, sfx)));
  }
  function key() { if (!ctx) return; const t = now(); osc('sine', 880, t, 0.05, G(t, 0.001, 0.12, 0.04, sfx)); }
  function pop() { if (!ctx) return; const t = now(); const o = osc('sine', 420, t, 0.12, G(t, 0.002, 0.22, 0.1, sfx)); o.frequency.exponentialRampToValueAtTime(1200, t + 0.07); }
  function clack(big = false) {
    if (!ctx) return; const t = now();
    const o = osc('sine', big ? 200 : 330, t, 0.4, G(t, 0.001, big ? 0.8 : 0.5, big ? 0.35 : 0.16, sfx)); o.frequency.exponentialRampToValueAtTime(big ? 50 : 110, t + (big ? 0.25 : 0.1));
    N(t, 0.06, F('bandpass', 2400, 1.4, G(t, 0.001, big ? 0.5 : 0.4, 0.05, sfx)));
  }
  function boom(v = 1, t) {
    if (!ctx) return; t = t || now();
    kick(t, v, sfx);
    const o = osc('sine', 95, t, 1.6, G(t, 0.003, v * 0.7, 1.5, sfx)); o.frequency.exponentialRampToValueAtTime(28, t + 1.3);
    N(t, 1, F('lowpass', 700, 0.7, G(t, 0.002, v * 0.55, 0.9, sfx)));
    N(t, 0.25, F('bandpass', 1800, 0.8, G(t, 0.001, v * 0.3, 0.2, sfx)));
  }
  function crash(t, v = 0.4) {
    if (!ctx) return; t = t || now();
    N(t, 2.4, F('highpass', 5200, 0.5, G(t, 0.002, v, 2.2, sfx)));
    const bp = F('bandpass', 8500, 0.7, G(t, 0.001, v * 0.45, 1.3, sfx));
    [205.3, 304.4, 369.6, 522.7, 540, 800].forEach((f) => osc('square', f * 1.72, t, 1.35, bp));
  }
  function brass(t, fs, dur, v = 0.18) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.025); g.gain.setTargetAtTime(v * 0.72, t + 0.03, 0.12); g.gain.setTargetAtTime(0, t + dur, 0.09);
    g.connect(sfx);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 1.2;
    lp.frequency.setValueAtTime(700, t); lp.frequency.linearRampToValueAtTime(3800, t + 0.06); lp.frequency.setTargetAtTime(2300, t + 0.07, 0.25);
    lp.connect(g);
    const end = t + dur + 0.6;
    fs.forEach((f) => [-9, 0, 9].forEach((c) => {
      const o = osc('sawtooth', f, t, end - t, lp); o.detune.setValueAtTime(c, t);
      if (dur > 0.45) { const l = ctx.createOscillator(), lg = ctx.createGain(); l.frequency.value = 5.6; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(14, t + 0.5); l.connect(lg); lg.connect(o.detune); l.start(t); l.stop(end); }
    }));
  }
  function sparkle(t, n = 14) {
    if (!ctx) return; t = t || now();
    const ns = [84, 86, 88, 91, 93, 96, 98, 100];
    for (let i = 0; i < n; i++) { const tt = t + i * 0.055 + Math.random() * 0.03; osc('sine', mf(ns[(Math.random() * ns.length) | 0]), tt, 0.5, G(tt, 0.002, 0.05, 0.45, sfx)); }
  }
  function fanfare() {
    if (!ctx) return;
    const t = now() + 0.02, T = 0.1, A = [67, 71, 74].map(mf), B = [72, 76, 79, 84].map(mf);
    brass(t, A, T * 0.75); brass(t + T, A, T * 0.75); brass(t + T * 2, A, T * 0.75);
    brass(t + T * 3, B, 1.3, 0.22); crash(t + T * 3, 0.42); kick(t + T * 3, 1, sfx); sparkle(t + T * 3 + 0.1);
  }
  function bigFanfare() {
    if (!ctx) return;
    const t = now() + 0.02, T = 0.13, m = (a) => a.map(mf);
    [0, 1, 2].forEach((i) => brass(t + i * T, m([59, 63, 66, 71]), T * 0.75, 0.2));
    const t1 = t + 3 * T;
    brass(t1, m([64, 68, 71, 76]), 0.55, 0.24); crash(t1, 0.5); kick(t1, 1.1, sfx);
    brass(t1 + 0.62, m([60, 64, 67, 72]), 0.26, 0.24);
    brass(t1 + 0.92, m([62, 66, 69, 74]), 0.26, 0.24);
    const t2 = t1 + 1.22;
    brass(t2, m([64, 68, 71, 76, 83]), 2.8, 0.28); crash(t2, 0.6); boom(1, t2); sparkle(t2 + 0.1, 24);
  }
  function heartbeat(v = 1) {
    if (!ctx) return; const t = now();
    [[0, 1], [0.19, 0.7]].forEach(([dt, k]) => {
      const tt = t + dt;
      const o = osc('sine', 80, tt, 0.3, G(tt, 0.004, v * k, 0.24, sfx)); o.frequency.exponentialRampToValueAtTime(42, tt + 0.2);
      const o2 = osc('triangle', 150, tt, 0.15, F('lowpass', 420, 1, G(tt, 0.003, v * k * 0.5, 0.13, sfx))); o2.frequency.exponentialRampToValueAtTime(70, tt + 0.12);
    });
  }
  function whoosh(up = false, dur = 0.55) {
    if (!ctx) return; const t = now();
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.32, t + dur * 0.55); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); g.connect(sfx);
    const bp = F('bandpass', up ? 500 : 4500, 1.6, g); bp.frequency.setValueAtTime(up ? 500 : 4500, t); bp.frequency.exponentialRampToValueAtTime(up ? 6000 : 350, t + dur);
    N(t, dur, bp);
  }
  // vinyl "wicka-wicka"
  function scratch() {
    if (!ctx) return; const t = now(), dur = 0.42;
    const g = ctx.createGain(); g.connect(sfx); g.gain.setValueAtTime(0.0001, t);
    [[0.03, 0.45], [0.12, 0.5], [0.15, 0.05], [0.18, 0.5], [0.3, 0.45], [0.34, 0.04], [0.36, 0.4], [0.42, 0.0001]].forEach(([d, v]) => g.gain.linearRampToValueAtTime(v, t + d));
    const c1 = new Float32Array(32), c2 = new Float32Array(32);
    for (let i = 0; i < 32; i++) { const w = Math.abs(Math.sin((i / 31) * Math.PI * 2.4)); c1[i] = 400 + 1600 * w; c2[i] = 120 + 500 * w; }
    const bp = F('bandpass', 900, 3, g); bp.frequency.setValueCurveAtTime(c1, t, dur); N(t, dur, bp);
    const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueCurveAtTime(c2, t, dur);
    o.connect(F('lowpass', 1800, 1, G(t, 0.005, 0.12, dur, sfx))); o.start(t); o.stop(t + dur + 0.05);
  }
  function fw() {
    if (!ctx) return; const t = now();
    N(t, 0.5, F('lowpass', 900, 0.7, G(t, 0.002, 0.22, 0.45, sfx)));

  Snd.init();
  const n = Picker.value();
  if (n < need()) { Picker.nudge(); hint(n ? '최소 ' + need() + '명 이상 입력해주세요' : '참여 인원을 입력해주세요'); return; }
  const saved = load();
  if (saved && (saved.shirts.length || saved.grand != null)) {
    if (!(await ask('새로 시작할까요?', '이전 추첨 기록이 지워지고 ' + n + '명으로 새로 시작합니다.', '새로 시작'))) return;
  }
  st = defaults(); st.n = n;
  save(); enterStage();
};
$('#resumeBtn').onclick = () => { const s = load(); if (s) { st = s; enterStage(); } };

/* =========================================================
   STEP 2·3 · 추첨
   ========================================================= */
function enterStage() {
  Snd.init(); keepAwake(); enterFS();
  shown = st.shirts.length;
  phase = shown < st.shirtCount ? 'shirt' : st.grand == null ? 'grand' : 'done';
  if (phase === 'done') { showFinale(); return; }
  body.classList.toggle('grand', phase === 'grand');
  Reels.build(String(st.n).length);
  renderChips(); updateStage();
  show('stage');
  Snd.scratch();
  setTimeout(() => Snd.playBGM(phase === 'grand' ? 'tension' : 'groove'), 380);
  if (phase === 'grand') { Reels.rest(); setMode('bare'); setTimeout(showGate, 700); } else { Reels.idle(); setMode('start'); }
}
function stageText() {
  const grand = phase === 'grand';
  const idx = Math.min(st.shirts.length + 1, st.shirtCount);
  return { tag: grand ? '1등 경품' : '기념티셔츠 ' + idx + ' / ' + st.shirtCount, prompt: grand ? 'handytraxx 턴테이블의 주인공은?' : '심의필 티셔츠의 주인공은?' };
}
function updateStage() {
  const s = stageText();
  $('#sTag').textContent = s.tag; $('#sPrompt').textContent = s.prompt;
  $('#drawBtn').textContent = phase === 'grand' ? '1등 추첨하기' : '추첨하기';
}
function renderChips(arrive) {
  const el = $('#chips');
  let html = '';
  for (let i = 0; i < st.shirtCount; i++) {
    const n = st.shirts[i], on = i < shown;
    html += '<div class="chip' + (on ? ' on' : '') + (i === arrive ? ' arrive' : '') + (n >= 1000 ? ' n4' : '') + '"><b>' + (on ? n : '') + '</b></div>';
  }
  el.innerHTML = html;
  $('#stage').classList.toggle('has-chips', shown > 0);
}
// start: the draw button (first draw only) · drawing: "추첨중입니다" · bare: neither, under the 1등 gate
function setMode(m) {
  const s = $('#stage');
  s.classList.remove('m-start', 'm-drawing', 'm-bare'); s.classList.add('m-' + m);
  $('#drawBtn').disabled = m !== 'start';
}

async function draw() {
  if (busy || (phase !== 'shirt' && phase !== 'grand')) return;
  const kind = phase, p = pool(kind);
  if (!p.length) { toast('추첨할 수 있는 번호가 남아있지 않아요'); setMode(kind === 'grand' ? 'bare' : 'start'); return; }
  busy = true; Snd.init(); setMode('drawing');
  const num = p[randInt(p.length)];
  if (kind === 'shirt') st.shirts.push(num); else st.grand = num;
  save();
  current = { kind, num };
  const s = pad(num);
  if (kind === 'shirt') await seqShirt(s); else await seqGrand(s);
  await showWin(kind, num);
  busy = false;
}

async function seqShirt(s) {
  const D = s.length;
  Snd.duck(true); Snd.startRoll();
  Reels.spin(24);
  await sleep(1500);
  for (let i = 0; i < D - 1; i++) { Reels.land(i, +s[i], 0.8).then(() => Snd.clack()); await sleep(480); }
  await Reels.land(D - 1, +s[D - 1], 1.5);
  Snd.stopRoll(); Snd.clack(true); Snd.fanfare(); Snd.duck(false);
  await sleep(260);
}

let victoryT = 0;
async function seqGrand(s) {
  const D = s.length, li = D - 1;
  Snd.grandBuild(3.2);
  Reels.spin(28);
  await sleep(3000);
  for (let i = 0; i < li; i++) {
    await Reels.land(i, +s[i], 1.2);
    Snd.boom(0.8); Snd.crash(0, 0.2);
    await sleep(650);
  }
  // silence and a heartbeat, then the last digit crawls in
  Snd.hush(); body.classList.add('hush');
  Reels.slow(li, 7);
  for (let b = 0; b < 3; b++) { Snd.heartbeat(0.9 + b * 0.15); Reels.beat(li); await sleep(850); }
  Reels.loud(li, 0.32);
  await Reels.land(li, +s[li], 2.8);
  body.classList.remove('hush');
  Snd.unhush(); Snd.boom(1.2); Snd.bigFanfare();
  const [x, y] = Reels.center();
  FX.lightBurst(x, y);
  victoryT = setTimeout(() => { if (phase === 'grand' && st.grand != null) Snd.playBGM('victory'); }, 2700);
  await sleep(350);
}

/* =========================================================
   STEP 4 · 당첨
   ========================================================= */
async function showWin(kind, num) {
  const w = $('#win'), grand = kind === 'grand', s = stageText();
  $('#wTag').textContent = grand ? s.tag : '기념티셔츠 ' + st.shirts.length + ' / ' + st.shirtCount;
  $('#wPrompt').textContent = s.prompt;
  staticDigits($('#wDigits'), pad(num));
  $('#wDigits').style.cssText = '';
  $('#nextBtn').textContent = grand ? '결과 보기' : st.shirts.length >= st.shirtCount ? '1등 추첨으로' : '계속 추첨';
  disarm();
  w.classList.toggle('is-grand', grand);
  w.classList.remove('show', 'closing');
  const [x, y] = Reels.center();
  w.classList.add('open');
  const opening = iris(w, circle(0, x, y), circle(farR(x, y), x, y), grand ? 1400 : 1000, 'cubic-bezier(.65,0,.35,1)');
  requestAnimationFrame(() => w.classList.add('show'));
  if (grand) { FX.burst(x, y, 160); FX.rainForever(); [0, 1, 2, 3, 4].forEach((i) => setTimeout(() => { const [W, H] = FX.size(); FX.sparks(rnd(W * 0.15, W * 0.85), rnd(H * 0.12, H * 0.4)); }, 700 + i * 650)); }
  await opening;
}
function closeWin() {
  const w = $('#win');
  w.classList.remove('open', 'show', 'closing');
  w.style.transition = 'none'; setClip(w, 'none');
  $('#wDigits').style.cssText = '';
}

async function next() {
  if (busy || !current) return;
  busy = true;
  const { kind } = current;
  Snd.pop();
  if (kind === 'shirt') {
    const more = st.shirts.length < st.shirtCount;
    await collapseToChip(shown, more);
    current = null;
    if (more) { busy = false; draw(); return; }
    await grandIntro();
  } else {
    current = null;
    await toFinale();
  }
  busy = false;
}

// the dark screen shrinks into the winner's chip at the bottom left
async function collapseToChip(i, more) {
  const w = $('#win'), chip = $('#chips').children[i];
  const r = chip.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const d = $('#wDigits').getBoundingClientRect(), dx = cx - (d.left + d.width / 2), dy = cy - (d.top + d.height / 2);
  const [x, y] = Reels.center();
  // the stage underneath is already rolling for the next draw when the dark screen pulls away
  updateStage();
  if (more) { setMode('drawing'); Reels.spin(24); } else { setMode('bare'); Reels.rest(); }
  w.classList.add('closing'); Snd.whoosh(false);
  const dg = $('#wDigits');
  dg.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + (r.width / d.width).toFixed(3) + ')';
  dg.style.opacity = '0';
  await iris(w, circle(farR(x, y), x, y), circle(r.width / 2, cx, cy), 820, 'cubic-bezier(.65,0,.35,1)');
  shown = i + 1;
  renderChips(i);
  closeWin();
  Snd.clack();
}

let armT;
function disarm() { clearTimeout(armT); const b = $('#redrawBtn'); b.classList.remove('armed'); b.textContent = '재추첨하기'; }
$('#redrawBtn').onclick = () => {
  const b = $('#redrawBtn');
  if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = '한 번 더 누르면 재추첨'; clearTimeout(armT); armT = setTimeout(disarm, 3000); return; }
  disarm(); redraw();
};
async function redraw() {
  if (busy || !current) return;
  busy = true;
  const { kind, num } = current;
  current = null;
  if (kind === 'shirt') st.shirts.pop(); else st.grand = null;
  st.absent.push(num); save();
  const w = $('#win'), [x, y] = Reels.center();
  clearTimeout(victoryT);
  updateStage(); setMode('drawing'); Reels.spin(kind === 'grand' ? 28 : 24);
  w.classList.add('closing'); Snd.whoosh(false);
  await iris(w, circle(farR(x, y), x, y), circle(0, x, y), 800, 'cubic-bezier(.65,0,.35,1)');
  closeWin();
  toast(num + '번 불참 처리 · 다시 추첨합니다');
  if (kind === 'grand') { Snd.playBGM('tension'); FX.stop(); }
  busy = false;
  draw();
}
$('#nextBtn').onclick = next;
$('#drawBtn').onclick = draw;

/* the 1등 draw starts from one large button on a dimmed screen */
function showGate() { $('#gate').classList.add('show'); }
function hideGate() { $('#gate').classList.remove('show'); }
async function startGrand() {
  if (busy || phase !== 'grand' || !$('#gate').classList.contains('show')) return;
  Snd.pop(); hideGate();
  await sleep(550);
  draw();
}
$('#gateBtn').onclick = startGrand;

/* =========================================================
   1등 추첨 인트로
   ========================================================= */
async function grandIntro() {
  phase = 'intro';
  const it = $('#intro'), chip = $('#chips').children[st.shirtCount - 1].getBoundingClientRect();
  const cx = chip.left + chip.width / 2, cy = chip.top + chip.height / 2;
  $('#introLine').textContent = '기념티셔츠 ' + st.shirtCount + '명 추첨 완료';
  Snd.powerDown();
  await sleep(500);
  it.classList.add('open');
  await iris(it, circle(chip.width / 2, cx, cy), circle(farR(cx, cy), cx, cy), 1000, 'cubic-bezier(.65,0,.35,1)');
  const L = [$('#il1'), $('#il2'), $('#il3')];
  L[0].classList.add('on'); Snd.whoosh(true);
  await sleep(2300);
  L[0].classList.remove('on');
  await sleep(350);
  it.classList.add('lit'); L[1].classList.add('on'); Snd.boom(1.1); Snd.crash(0, 0.4); Snd.playBGM('tension');
  await sleep(2400);
  L[1].classList.remove('on');
  await sleep(350);
  L[2].classList.add('on'); Snd.whoosh(true); Snd.sparkle();
  // the stage turns dark underneath while the prize is on screen
  phase = 'grand'; body.classList.add('grand'); Reels.rest(); updateStage(); setMode('bare');
  await sleep(2800);
  L[2].classList.remove('on');
  it.style.transition = 'opacity .9s cubic-bezier(.22,1,.36,1)'; it.style.opacity = '0';
  await sleep(950);
  it.classList.remove('open', 'lit'); it.style.cssText = '';
  showGate();
}

/* =========================================================
   결과
   ========================================================= */
function renderFinale() {
  $('#fGrand').textContent = st.grand != null ? st.grand : '-';
  $('#fGrandWrap').classList.toggle('n4', st.grand >= 1000);
  const sorted = st.shirts.slice().sort((a, b) => a - b);
  $('#fShirtLabel').textContent = '기념티셔츠 ' + sorted.length + '명';
  $('#fChips').innerHTML = sorted.map((n) => '<div class="chip on' + (n >= 1000 ? ' n4' : '') + '"><b>' + n + '</b></div>').join('');
  $('#fAbsent').textContent = st.absent.length ? '불참 처리된 번호 ' + st.absent.join(', ') : '';
}
async function toFinale() {
  FX.burst(innerWidth / 2, innerHeight * 0.45, 140);
  phase = 'done'; hideGate();
  renderFinale();
  body.classList.remove('grand', 'hush');
  show('finale');
  const w = $('#win'), [W, H] = [innerWidth, innerHeight];
  w.classList.add('closing');
  await iris(w, circle(farR(W / 2, H / 2), W / 2, H / 2), circle(0, W / 2, H / 2), 1000, 'cubic-bezier(.65,0,.35,1)');
  closeWin();
  Snd.sparkle();
}
function showFinale() {
  FX.rainForever();
  phase = 'done'; hideGate(); renderFinale(); body.classList.remove('grand', 'hush'); show('finale');
  if (!Snd.playing()) Snd.playBGM('victory');
}

/* =========================================================
   설정 (long-press the ticker, or Esc)
   ========================================================= */
const menu = $('#menu');
function syncSnd() {
  const muted = !Snd.bgmOn && !Snd.sfxOn, b = $('#sndBtn');
  b.classList.toggle('muted', muted); b.setAttribute('aria-label', muted ? '소리 켜기' : '소리 끄기');
}
// one switch for both the music and the effects
$('#sndBtn').onclick = () => { const turnOn = !Snd.bgmOn && !Snd.sfxOn; Snd.setBgm(turnOn); Snd.setSfx(turnOn); syncSnd(); };
function syncMenu() {
  syncSnd();
  $('#mBgm').classList.toggle('on', Snd.bgmOn); $('#mBgm b').textContent = Snd.bgmOn ? '켜짐' : '꺼짐';
  $('#mSfx').classList.toggle('on', Snd.sfxOn); $('#mSfx b').textContent = Snd.sfxOn ? '켜짐' : '꺼짐';
  $('#mFs').hidden = !canFS;
  $('#mResult').hidden = !(st.n && (st.shirts.length || st.grand != null)) || phase === 'done';
}
function openMenu() { if (busy || phase === 'intro') return; syncMenu(); menu.classList.add('show'); }
function closeMenu() { menu.classList.remove('show'); }
let lpT;
const tk = $('#ticker');
tk.addEventListener('pointerdown', () => { clearTimeout(lpT); lpT = setTimeout(openMenu, 650); });
['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => tk.addEventListener(ev, () => clearTimeout(lpT)));
tk.addEventListener('contextmenu', (e) => e.preventDefault());
tk.addEventListener('dblclick', openMenu);
menu.addEventListener('click', (e) => { if (e.target === menu) closeMenu(); });
$('#mClose').onclick = closeMenu;
$('#mBgm').onclick = () => { Snd.setBgm(!Snd.bgmOn); syncMenu(); };
$('#mSfx').onclick = () => { Snd.setSfx(!Snd.sfxOn); syncMenu(); };
$('#mFs').onclick = () => { toggleFS(); closeMenu(); };
$('#mResult').onclick = () => { closeMenu(); Reels.idle(); showFinale(); };
$('#mReset').onclick = async () => { closeMenu(); await resetAll(); };
$('#fReset').onclick = () => resetAll();

async function resetAll() {
  if (busy || phase === 'intro') return;
  if (!(await ask('처음부터 다시 시작할까요?', '지금까지의 추첨 결과가 모두 지워집니다.', '초기화'))) return;
  FX.stop();
  Snd.stopBGM(); clearSaved();
  st = defaults(); current = null; shown = 0; phase = 'setup';
  body.classList.remove('grand', 'hush');
  closeWin(); hideGate();
  $('#resumeBtn').hidden = true;
  Picker.set(0, 500);
  show('setup');
}

/* =========================================================
   Keyboard (for testing on a laptop)
   ========================================================= */
let typed = '', typedT = 0;
addEventListener('keydown', (e) => {
  if ($('#ask').classList.contains('show')) { if (e.key === 'Escape') $('#askNo').click(); return; }
  if (e.key === 'Escape') { menu.classList.contains('show') ? closeMenu() : openMenu(); return; }
  if (menu.classList.contains('show')) return;
  if (phase === 'setup') {
    if (Picker.typing()) return;
    if (/^[0-9]$/.test(e.key)) { const t = performance.now(); typed = (t - typedT < 1500 ? typed : '') + e.key; typed = typed.replace(/^0+/, '').slice(0, 4); typedT = t; Picker.set(+typed || 0, 260); }
    else if (e.key === 'Backspace') { typed = String(Picker.value()).slice(0, -1); typedT = performance.now(); Picker.set(+typed || 0, 260); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); Picker.set(Picker.value() + 1, 160); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); Picker.set(Picker.value() - 1, 160); }
    else if (e.key === 'Enter') { e.preventDefault(); $('#okBtn').click(); }
    return;
  }
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if ($('#gate').classList.contains('show')) startGrand();
    else if ($('#win').classList.contains('show')) next();
    else if ($('#stage').classList.contains('active') && $('#stage').classList.contains('m-start')) draw();
  } else if (e.key === 'm' || e.key === 'M') { $('#sndBtn').click(); }
  else if (e.key === 'f' || e.key === 'F') toggleFS();
});
// unlock audio on the first touch (iOS needs a user gesture)
['pointerdown', 'touchend', 'click'].forEach((ev) => addEventListener(ev, () => Snd.init(), { passive: true }));
// keep Space/Enter from re-clicking whichever button was tapped last
addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) b.blur(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && phase !== 'setup') { keepAwake(); Snd.init(); } });

/* =========================================================
   Boot
   ========================================================= */
(() => {
  body.classList.add('on-setup');
  syncSnd();
  const s = load();
  if (s) {
    const won = s.shirts.length + (s.grand != null ? 1 : 0);
    const b = $('#resumeBtn');
    b.hidden = false;
    b.textContent = '이전 추첨 이어하기 · ' + s.n + '명 중 ' + won + '명 당첨';
    setTimeout(() => Picker.set(s.n, 900), 500);
  }
})();
})();
</script>
</body>
   
</html>
